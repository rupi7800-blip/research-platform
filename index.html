<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piattaforma di ricerca</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Piattaforma di ricerca</h1>
  <input id="cerca" type="search" placeholder="Cerca negli argomenti e nei testi…" aria-label="Cerca">
</header>
<div class="corpo">
  <nav id="nav" aria-label="Categorie"></nav>
  <main id="main"><p class="vuoto">Caricamento…</p></main>
</div>
<footer>
  <span class="badge ok">verificata</span> fonte riletta direttamente ·
  <span class="badge no">non verificata</span> fonte non riletta ·
  <span class="badge ass">fonte non reperita</span> identificativo assente
</footer>
<script src="app.js"></script>
</body>
</html>
